  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0f0c29, #302b63, #222);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 2rem;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #7c6df0;
            border-radius: 10px;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(15, 12, 41, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.75rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #7c6df0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .categories {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.25rem 0;
            flex: 1;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .categories::-webkit-scrollbar {
            height: 4px;
        }
        .cat-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            position: relative;
        }
        .cat-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }
        .cat-btn.active {
            color: #fff;
            background: rgba(124, 109, 240, 0.25);
            box-shadow: 0 0 0 1px rgba(124, 109, 240, 0.3);
        }
        .cat-btn i {
            margin-right: 5px;
            font-size: 0.9rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 30px;
            padding: 0.3rem 0.3rem 0.3rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border 0.25s;
            flex-shrink: 0;
            min-width: 180px;
        }
        .search-box:focus-within {
            border-color: rgba(124, 109, 240, 0.5);
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.85rem;
            padding: 0.4rem 0;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        .search-box .search-icon {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1rem;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .search-box .search-icon:hover {
            color: #a78bfa;
        }

        /* MAIN GRID */
        .main-wrap {
            max-width: 1400px;
            margin: 1.5rem auto 0;
            padding: 0 1.5rem;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        .section-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
        }
        .section-header h2 i {
            color: #a78bfa;
            margin-right: 8px;
        }
        .section-header .result-count {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
        }
        @media (min-width: 576px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
        @media (min-width: 768px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
        @media (min-width: 992px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }

        .channel-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 1rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
            color: #fff;
            min-height: 130px;
            position: relative;
        }
        .channel-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(124, 109, 240, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        .channel-card:active {
            transform: scale(0.96);
        }
        .channel-card .logo-wrap {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px;
            margin-bottom: 0.6rem;
            transition: background 0.3s;
        }
        .channel-card:hover .logo-wrap {
            background: rgba(0, 0, 0, 0.35);
        }
        .channel-card .logo-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
            transition: transform 0.3s;
        }
        .channel-card:hover .logo-wrap img {
            transform: scale(1.05);
        }
        .channel-card .channel-name {
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-width: 100%;
            padding: 0 0.2rem;
        }
        .channel-card .play-icon {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            transition: color 0.3s;
        }
        .channel-card:hover .play-icon {
            color: rgba(167, 139, 250, 0.7);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #1a1833;
            border-radius: 20px;
            width: 100%;
            max-width: 1000px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: slideUp 0.35s ease;
        }
        .modal-box .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            font-size: 1.6rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .modal-box .modal-close:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .modal-box iframe {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            border: none;
            display: block;
            background: #000;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* EMPTY STATE */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(255, 255, 255, 0.3);
        }
        .empty-state i {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.75rem;
        }
        .empty-state p {
            font-size: 0.95rem;
        }

        /* RESPONSIVE */
        @media (max-width: 640px) {
            .nav-container {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }
            .logo {
                text-align: center;
                font-size: 1.4rem;
            }
            .categories {
                gap: 0.3rem;
                padding-bottom: 0.2rem;
            }
            .cat-btn {
                font-size: 0.75rem;
                padding: 0.3rem 0.8rem;
            }
            .search-box {
                min-width: unset;
                width: 100%;
            }
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 0.7rem;
            }
            .channel-card {
                min-height: 110px;
                padding: 0.7rem 0.3rem;
            }
            .channel-card .logo-wrap {
                width: 55px;
                height: 55px;
            }
            .channel-card .channel-name {
                font-size: 0.6rem;
            }
            .modal-box iframe {
                height: 50vh;
                min-height: 250px;
            }
            .modal-box .modal-close {
                top: 6px;
                right: 10px;
                width: 34px;
                height: 34px;
                font-size: 1.3rem;
            }
        }
        @media (max-width: 400px) {
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 0.5rem;
            }
            .channel-card .logo-wrap {
                width: 90px;
                height: 90px;
            }
            .channel-card .channel-name {
                font-size: 0.55rem;
            }
        }
    </style>
</head>

        // ============================================================
        //  STATE
        // ============================================================
        let currentCategory = 'fr';
        let searchTerm = '';

        // DOM refs
        const categoryContainer = document.getElementById('categoryContainer');
        const channelsGrid = document.getElementById('channelsGrid');
        const categoryTitle = document.getElementById('categoryTitle');
        const resultCount = document.getElementById('resultCount');
        const searchInput = document.getElementById('searchInput');
        const playerModal = document.getElementById('playerModal');
        const playerIframe = document.getElementById('playerIframe');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // ============================================================
        //  CATEGORY DEFINITIONS
        // ============================================================
        const CATEGORIES = [
            	{ key: 'fr', label: 'ฟรีทีวี', icon: 'bi-tv' },
	   	{ key: 'ep', label: 'EPL', icon: 'bi-emoji-smile' },
            	{ key: 'sp', label: 'กีฬา', icon: 'bi-trophy' },
            	{ key: 'dc', label: 'สารคดี', icon: 'bi-book' },
            	{ key: 'mv', label: 'บันเทิง', icon: 'bi-film' },
            	{ key: 'nw', label: 'ข่าว', icon: 'bi-newspaper' },
            	{ key: 'kd', label: 'เด็ก', icon: 'bi-emoji-smile' },
            
	   
        ];

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================
        function renderCategories() {
            categoryContainer.innerHTML = CATEGORIES.map(cat =>
                `<button class="cat-btn ${cat.key === currentCategory ? 'active' : ''}" data-category="${cat.key}">
                    <i class="bi ${cat.icon}"></i> ${cat.label}
                </button>`
            ).join('');

            // Event listeners
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.category;
                    if (key === currentCategory && searchTerm === '') return;
                    currentCategory = key;
                    searchTerm = '';
                    searchInput.value = '';
                    updateUI();
                });
            });
        }

        function getChannelsForCategory(key) {
            return CHANNELS[key] || [];
        }

        function getAllChannels() {
            let all = [];
            for (const key in CHANNELS) {
                all = all.concat(CHANNELS[key].map(ch => ({ ...ch, category: key })));
            }
            return all;
        }

        function renderChannels(channels) {
            if (!channels || channels.length === 0) {
                channelsGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-search"></i>
                        <p>ไม่พบช่องที่ค้นหา</p>
                    </div>
                `;
                resultCount.textContent = '0 ช่อง';
                return;
            }

            channelsGrid.innerHTML = channels.map(ch =>
                `<div class="channel-card" data-url="${ch.url}" data-name="${ch.name}">
                    <div class="logo-wrap">
                        <img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.style.display='none'">
                    </div>
                    <span class="channel-name">${ch.name}</span>
                    <i class="bi bi-play-circle play-icon"></i>
                </div>`
            ).join('');

            resultCount.textContent = `${channels.length} ช่อง`;

            // Click handler for each card
            document.querySelectorAll('.channel-card').forEach(card => {
                card.addEventListener('click', () => {
                    const url = card.dataset.url;
                    openPlayer(url);
                });
            });
        }

        function updateUI() {
            // Update category title
            const cat = CATEGORIES.find(c => c.key === currentCategory);
            categoryTitle.textContent = cat ? cat.label : '';

            // Highlight active category
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === currentCategory);
            });

            // Get channels
            let channels = [];
            if (searchTerm.trim() === '') {
                channels = getChannelsForCategory(currentCategory);
            } else {
                // Search across all categories
                const all = getAllChannels();
                const term = searchTerm.trim().toLowerCase();
                channels = all.filter(ch =>
                    ch.name.toLowerCase().includes(term) ||
                    ch.id.toLowerCase().includes(term)
                );
                // แสดงหมวดหมู่ที่ค้นหา
                categoryTitle.textContent = `ผลการค้นหา "${searchTerm.trim()}"`;
            }

            renderChannels(channels);
        }

        // ============================================================
        //  PLAYER MODAL
        // ============================================================
        function openPlayer(url) {
            playerIframe.src = url; autoplay=1;
            playerModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            playerIframe.src = '';
            playerModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal events
        closeModalBtn.addEventListener('click', closePlayer);
        playerModal.addEventListener('click', (e) => {
            if (e.target === playerModal) closePlayer();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePlayer();
        });

        // ============================================================
        //  SEARCH
        // ============================================================
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            searchTerm = val;
            updateUI();
        });

        // ============================================================
        //  INIT
        // ============================================================
        renderCategories();
        updateUI();

        console.log('🎬 DontKnow IPTV พร้อมใช้งานแล้ว!');
    </script>
